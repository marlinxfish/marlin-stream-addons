services:
  addon:
    build: .
    container_name: marlin-stream-addon
    restart: unless-stopped
    expose:
      - "7000"
    environment:
      - HOST=0.0.0.0
      - PORT=7000
      - PROVIDER_OPPADRAMA_ENABLED=${PROVIDER_OPPADRAMA_ENABLED:-true}
      - OPPADRAMA_BASE_URL=${OPPADRAMA_BASE_URL:-http://212.86.121.175}
      - PROVIDER_NONTONANIMEID_ENABLED=${PROVIDER_NONTONANIMEID_ENABLED:-true}
      - NONTONANIMEID_BASE_URL=${NONTONANIMEID_BASE_URL:-https://s13.nontonanimeid.boats}
      - ADDON_NAME=${ADDON_NAME:-Marlin Stream}
      - ADDON_ICON=${ADDON_ICON:-🐟}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-6000}
      - CACHE_STREAM_TTL=${CACHE_STREAM_TTL:-3600}
      - CACHE_META_TTL=${CACHE_META_TTL:-86400}
      - ACCESS_KEY=${ACCESS_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: marlin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      addon:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
